
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean up the source workspace.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/bin/sh
        set -eu
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-clone
spec:
  description: Clone the project repository into the workspace.
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
    - name: deleteExisting
      type: string
      default: "true"
  workspaces:
    - name: output
  steps:
    - name: clone
      image: alpine/git:2.45.2
      workingDir: $(workspaces.output.path)
      script: |
        #!/bin/sh
        set -eu

        if [ "$(params.deleteExisting)" = "true" ]; then
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        fi

        git clone \
          --branch "$(params.revision)" \
          --single-branch \
          "$(params.url)" \
          /tmp/project

        cp -a /tmp/project/. .
        rm -rf /tmp/project

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8
spec:
  description: Install project dependencies and run Flake8.
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        flake8 .

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Run the project unit tests with Nose.
  params:
    - name: args
      description: Arguments to pass to Nose.
      type: string
      default: "-v"
  workspaces:
    - name: source
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        nosetests $(params.args)



---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah
spec:
  params:
    - name: IMAGE
      type: string
  workspaces:
    - name: source
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.35.0
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: false
        capabilities:
          add:
            - SETFCAP
      script: |
        buildah bud \
          --storage-driver=vfs \
          --isolation=chroot \
          -t "$(params.IMAGE)" .

        buildah push \
          --storage-driver=vfs \
          "$(params.IMAGE)"

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: openshift-client
spec:
  description: Deploy the application to OpenShift.
  params:
    - name: SCRIPT
      description: OpenShift CLI commands to execute.
      type: string
      default: oc version
  workspaces:
    - name: manifest-dir
  steps:
    - name: run-oc
      image: quay.io/openshift/origin-cli:latest
      workingDir: $(workspaces.manifest-dir.path)
      script: |
        #!/bin/sh
        set -eu
        $(params.SCRIPT)
